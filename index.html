      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var saved = JSON.parse(localStorage.getItem("pg-theme") || "null");
          if (saved && (saved.mode === "light" || saved.mode === "dark")) mode = saved.mode;
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.background = mode === "dark" ? "#13140f" : "#fff8f3";
          document.documentElement.style.color = mode === "dark" ? "#e7e4d8" : "#1d1c16";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
