<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThePotatoGamer</title>
    <meta
      name="description"
      content="Personal site of ThePotatoGamer. Live Discord presence, links, setup, and a guestbook."
    />
    <meta name="theme-color" content="#E39B12" />
    <meta property="og:title" content="ThePotatoGamer" />
    <meta property="og:description" content="Personal site of ThePotatoGamer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://potatogamer.uk/" />
    <link id="favicon" rel="icon" />
    <script>
      (function () {
        var link = document.getElementById("favicon");
        fetch("https://api.lanyard.rest/v1/users/639906782658953256")
          .then(function (response) {
            return response.json();
          })
          .then(function (body) {
            var user = body && body.data && body.data.discord_user;
            if (!link || !user || !user.avatar) return;
            link.href = "https://cdn.discordapp.com/avatars/" + user.id + "/" + user.avatar + ".png?size=128";
            link.type = "image/png";
          })
          .catch(function () {});
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var saved = JSON.parse(localStorage.getItem("pg-theme") || "null");
          if (saved && (saved.mode === "light" || saved.mode === "dark")) mode = saved.mode;
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.background = mode === "dark" ? "#13140f" : "#fff8f3";
          document.documentElement.style.color = mode === "dark" ? "#e7e4d8" : "#1d1c16";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript for the live dashboard.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
